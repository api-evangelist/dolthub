meters:
- name: private_storage_base
  description: Flat $5/month for private data above 100 MB and up to 5 GB.
  unit: months
  aggregation: sum
  dimensions:
  - account
- name: private_storage_overage
  description: Private data storage above 5 GB, billed at $1/GB/month.
  unit: gigabytes
  aggregation: max
  dimensions:
  - account
  - database
- name: public_database_hosting
  description: Public database hosting and read SQL API, provided free of charge.
  unit: databases
  aggregation: count
  dimensions:
  - account
principles:
- name: Visibility
  description: Track total private data size per database; the 100 MB and 5 GB thresholds determine which tier applies.
- name: Allocation
  description: Map private databases to owners/teams; public databases carry no cost.
- name: Optimization
  description: Keep non-sensitive datasets public (free); prune history and large blobs to stay under the 5 GB flat-rate threshold.
- name: Accountability
  description: Assign an owner per private database; review private storage growth monthly against the $5 base and $1/GB overage.
