description: >-
  FinOps view of DoltHub spend. Public databases and the read SQL API are free.
  Cost is driven entirely by private data storage under DoltHub Pro: the first
  100 MB of private data is free, a flat $5/month applies above 100 MB up to
  5 GB, and storage over 5 GB is billed at $1/GB/month. The HTTP API is not
  separately metered per request.
notes: >-
  Storage-tier pricing reflects the 2026-04-24 DoltHub Pro relaunch; verify
  against the DoltHub pricing page during reconciliation.
