  description: >-
    The open-source Dolt database ships a MySQL-compatible SQL server (dolt sql-server) over the MySQL
    wire protocol, giving the same versioned database hosted on DoltHub a self-hostable, drop-in SQL interface
    for any MySQL client or driver.
