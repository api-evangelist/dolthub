    type: Documentation
  - url: https://docs.dolthub.com/products/dolthub/api/sql
    type: APIReference
  - url: openapi/dolthub-openapi.yml
    type: OpenAPI
  - url: collections/dolthub.postman_collection.json
    type: Postman
